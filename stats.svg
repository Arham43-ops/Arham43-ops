<svg width="480" height="260" viewBox="0 0 480 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Arham GitHub stats card">
<defs>
  <linearGradient id="sbg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#150821"/><stop offset="100%" stop-color="#2d0e46"/>
  </linearGradient>
  <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ff3fa6"/><stop offset="100%" stop-color="#b968ff"/>
  </linearGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
  <clipPath id="round"><rect width="480" height="260" rx="18"/></clipPath>
</defs>
<g clip-path="url(#round)">
<rect width="480" height="260" fill="url(#sbg)"/>
<rect width="480" height="260" fill="none" stroke="#5a2a8c" stroke-width="1.5"/>
<text x="24" y="34" font-size="16" font-weight="700" fill="#f3e8ff" font-family="Arial, sans-serif">Arham's GitHub Stats</text>
<line x1="24" y1="46" x2="456" y2="46" stroke="#5a2a8c" stroke-opacity="0.5"/>

<circle cx="90" cy="150" r="62" fill="none" stroke="#2a1440" stroke-width="10"/>
<circle cx="90" cy="150" r="62" fill="none" stroke="url(#ringGrad)" stroke-width="10"
  stroke-linecap="round" transform="rotate(-90 90 150)" stroke-dasharray="389.6" stroke-dashoffset="389.6" filter="url(#glow)">
  <animate attributeName="stroke-dashoffset" from="389.6" to="58.4" begin="0.3s" dur="1.6s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
</circle>
<text x="90" y="148" text-anchor="middle" font-size="26" font-weight="800" fill="#f3e8ff" font-family="Arial, sans-serif">85</text>
<text x="90" y="168" text-anchor="middle" font-size="10.5" fill="#c9a9e0" font-family="Arial, sans-serif" letter-spacing="1">DEV SCORE</text>
<g transform="translate(225,74)" opacity="0">
      <animateTransform attributeName="transform" type="translate" additive="sum" from="60,0" to="0,0" begin="0.60s" dur="0.6s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
      <animate attributeName="opacity" from="0" to="1" begin="0.60s" dur="0.5s" fill="freeze"/>
      <text x="0" y="0" font-size="12.5" fill="#c9a9e0" font-family="Arial, sans-serif">Public Repos</text>
      <text x="210" y="0" text-anchor="end" font-size="12.5" font-weight="700" fill="#f3e8ff" font-family="Arial, sans-serif">27</text>
      <rect x="0" y="8" width="210" height="7" rx="3.5" fill="#2a1440"/>
      <rect x="0" y="8" width="0" height="7" rx="3.5" fill="#ff8fd0">
        <animate attributeName="width" from="0" to="141.8" begin="0.70s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
      </rect>
    </g>
<g transform="translate(225,116)" opacity="0">
      <animateTransform attributeName="transform" type="translate" additive="sum" from="60,0" to="0,0" begin="0.78s" dur="0.6s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
      <animate attributeName="opacity" from="0" to="1" begin="0.78s" dur="0.5s" fill="freeze"/>
      <text x="0" y="0" font-size="12.5" fill="#c9a9e0" font-family="Arial, sans-serif">Followers</text>
      <text x="210" y="0" text-anchor="end" font-size="12.5" font-weight="700" fill="#f3e8ff" font-family="Arial, sans-serif">38</text>
      <rect x="0" y="8" width="210" height="7" rx="3.5" fill="#2a1440"/>
      <rect x="0" y="8" width="0" height="7" rx="3.5" fill="#b968ff">
        <animate attributeName="width" from="0" to="159.6" begin="0.88s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
      </rect>
    </g>
<g transform="translate(225,158)" opacity="0">
      <animateTransform attributeName="transform" type="translate" additive="sum" from="60,0" to="0,0" begin="0.96s" dur="0.6s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
      <animate attributeName="opacity" from="0" to="1" begin="0.96s" dur="0.5s" fill="freeze"/>
      <text x="0" y="0" font-size="12.5" fill="#c9a9e0" font-family="Arial, sans-serif">Total Stars</text>
      <text x="210" y="0" text-anchor="end" font-size="12.5" font-weight="700" fill="#f3e8ff" font-family="Arial, sans-serif">161</text>
      <rect x="0" y="8" width="210" height="7" rx="3.5" fill="#2a1440"/>
      <rect x="0" y="8" width="0" height="7" rx="3.5" fill="#5eead4">
        <animate attributeName="width" from="0" to="169.1" begin="1.06s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
      </rect>
    </g>
<g transform="translate(225,200)" opacity="0">
      <animateTransform attributeName="transform" type="translate" additive="sum" from="60,0" to="0,0" begin="1.14s" dur="0.6s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
      <animate attributeName="opacity" from="0" to="1" begin="1.14s" dur="0.5s" fill="freeze"/>
      <text x="0" y="0" font-size="12.5" fill="#c9a9e0" font-family="Arial, sans-serif">Years Building</text>
      <text x="210" y="0" text-anchor="end" font-size="12.5" font-weight="700" fill="#f3e8ff" font-family="Arial, sans-serif">2</text>
      <rect x="0" y="8" width="210" height="7" rx="3.5" fill="#2a1440"/>
      <rect x="0" y="8" width="0" height="7" rx="3.5" fill="#ffd166">
        <animate attributeName="width" from="0" to="84.0" begin="1.24s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
      </rect>
    </g>
</g></svg>